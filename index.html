<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LFG | Looking For Group</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505; /* Еще темнее */
            color: #e4e4e7;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Фоновый паттерн */
            background-image: radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.08), transparent 25%),
                              radial-gradient(circle at 85% 30%, rgba(0, 255, 170, 0.05), transparent 25%);
        }

        /* --- ОБЩИЕ СТИЛИ И АНИМАЦИИ --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            background: transparent;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
            z-index: 1;
        }
        .screen.hidden {
            transform: translateX(30%);
            opacity: 0;
            pointer-events: none;
        }

        /* --- СТАРТОВЫЙ ЭКРАН --- */
        .start-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .logo-main {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 0 30px rgba(124, 58, 237, 0.4);
            animation: pulse 3s infinite alternate;
        }
        @keyframes pulse { from { text-shadow: 0 0 20px rgba(124,58,237,0.2); } to { text-shadow: 0 0 40px rgba(124,58,237,0.6); } }
        
        .logo-sub {
            font-size: 12px;
            letter-spacing: 6px;
            color: #71717a;
            text-transform: uppercase;
            margin-bottom: 60px;
        }
        
        .start-btn {
            background: linear-gradient(180deg, #8b5cf6, #6d28d9);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            cursor: pointer;
            box-shadow: 0 6px 0 #4c1d95, 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .start-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #4c1d95, 0 5px 10px rgba(0,0,0,0.4);
        }

        /* --- ШАПКА АНКЕТЫ --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            flex-shrink: 0;
            z-index: 5;
        }
        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 40px; height: 40px;
            display: flex; justify-content: center; align-items: center;
            color: #a1a1aa;
            font-size: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .back-btn:active { background: rgba(255,255,255,0.15); }
        
        /* Прогресс-бар */
        .progress-container { flex: 1; margin: 0 15px; height: 6px; background: #27272a; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff007f, #8b5cf6); width: 0%; transition: width 0.5s ease; border-radius: 3px; }
        .progress-text { font-size: 14px; color: #71717a; font-weight: 700; }

        /* --- ФОРМА АНКЕТЫ --- */
        .form-container {
            flex: 1;
            padding: 10px 20px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        .form-container.fade-out { opacity: 0; transform: translateY(10px); }
        .form-container.fade-in { opacity: 1; transform: translateY(0); }

        .step-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; color: #fff; line-height: 1.2; }
        .step-desc { font-size: 15px; color: #a1a1aa; margin-bottom: 25px; line-height: 1.5; }

        /* Карточки правил */
        .rule-card {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #27272a;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        .rule-card h3 { color: #8b5cf6; font-size: 16px; margin-bottom: 10px; }
        .rule-list { list-style: none; padding: 0; }
        .rule-list li { font-size: 14px; color: #d4d4d8; margin-bottom: 10px; padding-left: 20px; position: relative; }
        .rule-list li::before { content: '•'; color: #8b5cf6; position: absolute; left: 0; font-size: 20px; line-height: 14px; }

        /* Поля ввода */
        .input-group { margin-bottom: 20px; }
        .input-label { font-size: 12px; color: #71717a; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: 700; letter-spacing: 1px; }
        .text-input {
            width: 100%;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .text-input:focus { border-color: #8b5cf6; box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }

        /* Чекбоксы */
        .checkbox-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #3f3f46;
            padding: 18px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        .checkbox-card:active { background: rgba(39, 39, 42, 0.8); }
        .checkbox-card.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }
        .checkbox-box {
            width: 26px; height: 26px;
            border-radius: 8px;
            border: 2px solid #52525b;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
            transition: 0.2s;
        }
        .checkbox-card.active .checkbox-box { background: #8b5cf6; border-color: #8b5cf6; }
        .checkbox-box svg { width: 16px; height: 16px; fill: white; display: none; }
        .checkbox-card.active .checkbox-box svg { display: block; }
        .checkbox-text { font-size: 15px; color: #e4e4e7; font-weight: 500; }

        /* Сетка игр */
        .search-bar {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #3f3f46;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-bar input { background: none; border: none; color: #fff; font-size: 15px; width: 100%; outline: none; }
        .search-bar svg { width: 20px; height: 20px; fill: #71717a; }

        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .game-card {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .game-card:active { transform: scale(0.96); }
        .game-card.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.15); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); }
        .game-icon { width: 36px; height: 36px; background: #3f3f46; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        .game-card.active .game-icon { background: #8b5cf6; }
        .game-icon svg { width: 20px; height: 20px; fill: #a1a1aa; }
        .game-card.active .game-icon svg { fill: white; }
        .game-name { font-size: 14px; font-weight: 600; color: #e4e4e7; }

        /* Ползунок ранга */
        .rank-slider-container {
            display: none;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #8b5cf6;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.15);
            animation: slideDown 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-15px); } to { opacity: 1; transform: translateY(0); } }
        .rank-slider-container.active { display: block; }
        .rank-title { font-size: 14px; color: #a1a1aa; margin-bottom: 15px; text-align: center; }
        .rank-value { font-size: 22px; font-weight: 800; color: #fff; text-align: center; margin-bottom: 15px; text-shadow: 0 0 10px rgba(139, 92, 246, 0.5); }
        
        .range-slider { -webkit-appearance: none; width: 100%; height: 8px; background: #27272a; border-radius: 4px; outline: none; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; background: #fff; border-radius: 50%; border: 4px solid #8b5cf6; cursor: pointer; box-shadow: 0 0 10px rgba(139, 92, 246, 0.5); }

        /* 5 Этап: Расписание */
        .schedule-section { margin-bottom: 25px; }
        .schedule-title { font-size: 14px; color: #a1a1aa; margin-bottom: 12px; font-weight: 600; }
        .days-row { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .day-btn { width: 40px; height: 40px; border-radius: 50%; background: rgba(24, 24, 27, 0.8); border: 1px solid #3f3f46; color: #a1a1aa; font-weight: bold; font-size: 12px; cursor: pointer; transition: 0.2s; }
        .day-btn.active { background: #8b5cf6; color: white; border-color: #8b5cf6; box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }

        .time-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .time-btn { flex: 1; background: rgba(24, 24, 27, 0.8); border: 1px solid #3f3f46; padding: 12px; border-radius: 12px; color: #a1a1aa; text-align: center; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .time-btn.active { border-color: #8b5cf6; color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }
        .time-btn span { display: block; font-size: 11px; margin-top: 4px; color: #52525b; }

        /* Кнопки навигации */
        .bottom-actions { margin-top: auto; padding-top: 20px; display: flex; gap: 12px; flex-shrink: 0; }
        .btn { border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.15s, box-shadow 0.15s; }
        .btn:active { transform: translateY(4px); }
        .btn-primary { background: linear-gradient(180deg, #8b5cf6, #6d28d9); color: white; box-shadow: 0 5px 0 #4c1d95; padding: 18px; }
        .btn-primary:active { box-shadow: 0 1px 0 #4c1d95; }
        .btn-secondary { background: rgba(24, 24, 27, 0.8); color: #e4e4e7; border: 1px solid #3f3f46; box-shadow: 0 5px 0 #09090b; padding: 18px; }
        .btn-secondary:active { box-shadow: 0 1px 0 #09090b; }
        .btn-half { flex: 1; }
        
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div class="screen start-screen" id="startScreen">
        <div class="logo-main">LFG</div>
        <div class="logo-sub">Looking for group</div>
        <button class="start-btn" onclick="startRegistration()">Создать анкету</button>
    </div>

    <!-- ЭКРАН АНКЕТЫ -->
    <div class="screen hidden" id="regScreen">
        <div class="header">
            <button class="back-btn" onclick="prevStep()">←</button>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <span class="progress-text" id="progressText">1/5</span>
        </div>
        
        <div class="form-container fade-in" id="formContainer">
            <!-- Сюда рендерятся шаги -->
        </div>

        <div class="bottom-actions" id="bottomActions">
            <!-- Кнопки навигации -->
        </div>
    </div>

    <script>
        // === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ===
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        let currentStep = 1;
        const totalSteps = 5;
        const formContainer = document.getElementById('formContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const bottomActions = document.getElementById('bottomActions');

        // Список игр (Имитация базы из 80+ игр)
        const gamesList = [
            { id: 'cs2', name: 'CS2', icon: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z', ranks: ['Silver', 'Gold', 'MG', 'DMG', 'Faceit 1', 'Faceit 10', 'Global'] },
            { id: 'dota', name: 'Dota 2', icon: 'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5', ranks: ['Herald', 'Guardian', 'Crusader', 'Archon', 'Legend', 'Ancient', 'Divine', 'Immortal'] },
            { id: 'val', name: 'Valorant', icon: 'M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z', ranks: ['Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Ascendant', 'Immortal', 'Radiant'] },
            { id: 'apex', name: 'Apex Legends', icon: 'M12 2L2 22h20L12 2z', ranks: ['Rookie', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Master', 'Predator'] },
            { id: 'pubg', name: 'PUBG', icon: 'M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z' },
            { id: 'mine', name: 'Minecraft', icon: 'M4 4h16v16H4z' },
            { id: 'gta', name: 'GTA V', icon: 'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z' },
            { id: 'fort', name: 'Fortnite', icon: 'M12 2L2 22h20L12 2z' },
            { id: 'lol', name: 'LoL', icon: 'M12 2L2 22h20L12 2z', ranks: ['Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Emerald', 'Diamond', 'Master', 'Challenger'] },
            // ... и другие игры можно добавить сюда по аналогии
        ];

        // === НАВИГАЦИЯ ===
        function startRegistration() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('regScreen').classList.remove('hidden');
            currentStep = 1;
            updateProgress();
            renderStep();
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                formContainer.classList.remove('fade-in');
                formContainer.classList.add('fade-out');
                setTimeout(() => {
                    currentStep++;
                    updateProgress();
                    renderStep();
                    formContainer.classList.remove('fade-out');
                    formContainer.classList.add('fade-in');
                }, 300);
            } else {
                alert("Анкета успешно создана!");
                location.reload();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                formContainer.classList.remove('fade-in');
                formContainer.classList.add('fade-out');
                setTimeout(() => {
                    currentStep--;
                    updateProgress();
                    renderStep();
                    formContainer.classList.remove('fade-out');
                    formContainer.classList.add('fade-in');
                }, 300);
            } else {
                document.getElementById('regScreen').classList.add('hidden');
                document.getElementById('startScreen').classList.remove('hidden');
            }
        }

        function updateProgress() {
            progressBar.style.width = `${(currentStep / totalSteps) * 100}%`;
            progressText.innerText = `${currentStep}/${totalSteps}`;
        }

        // === РЕНДЕР ШАГОВ ===
        function renderStep() {
            formContainer.innerHTML = '';
            bottomActions.innerHTML = '';

            if (currentStep === 1) {
                formContainer.innerHTML = `
                    <div class="step-title">Правила проекта</div>
                    <div class="step-desc">Пожалуйста, ознакомься с правилами нашего сообщества перед созданием анкеты.</div>
                    
                    <div class="rule-card">
                        <h3>1. Уважение</h3>
                        <ul class="rule-list">
                            <li>Общайтесь вежливо, без оскорблений и токсичности.</li>
                            <li>Запрещены любые проявления дискриминации.</li>
                        </ul>
                    </div>
                    
                    <div class="rule-card">
                        <h3>2. Честность</h3>
                        <ul class="rule-list">
                            <li>Указывайте только достоверную информацию о себе и своем ранге.</li>
                            <li>Запрещены фейковые анкеты и спам.</li>
                        </ul>
                    </div>

                    <div class="checkbox-card" id="rulesCheckbox" onclick="toggleCheck(this)">
                        <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="checkbox-text">Я согласен с правилами проекта</div>
                    </div>
                `;
                bottomActions.innerHTML = `<button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>`;
            } 
            else if (currentStep === 2) {
                formContainer.innerHTML = `
                    <div class="step-title">Создание анкеты</div>
                    <div class="step-desc">Расскажи о себе основное. Эта информация будет видна другим игрокам в твоей карточке.</div>
                    
                    <div class="input-group">
                        <label class="input-label">Твой никнейм</label>
                        <input type="text" class="text-input" placeholder="Например: Sn1per" value="Игрок">
                    </div>

                    <div class="input-group">
                        <label class="input-label">Дата рождения</label>
                        <input type="date" class="text-input">
                        <div style="font-size: 12px; color: #52525b; margin-top: 8px;">В анкете будет отображаться только возраст.</div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Пол</label>
                        <div style="display: flex; gap: 10px;">
                            <button class="btn btn-secondary" style="flex: 1; padding: 12px;">Парень</button>
                            <button class="btn btn-s
