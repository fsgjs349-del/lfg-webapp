<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LFG | Looking For Group</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505; color: #e4e4e7; height: 100vh; height: 100dvh;
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        /* --- ЛОГИКА ПЕРЕКЛЮЧЕНИЯ ЭКРАНОВ БЕЗ JS --- */
        /* Скрываем все радио-кнопки */
        input[type="radio"] { display: none; }

        /* Все экраны скрыты по умолчанию */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; background: #050505; z-index: 1;
        }

        /* Показываем экран, если выбрана соответствующая радио-кнопка */
        #step0:checked ~ #screen0,
        #step1:checked ~ #screen1,
        #step2:checked ~ #screen2,
        #step3:checked ~ #screen3,
        #step4:checked ~ #screen4,
        #step5:checked ~ #screen5 { display: flex; }

        /* --- ДИЗАЙН --- */
        .bg-emoji { position: absolute; opacity: 0.05; font-size: 50px; animation: float 10s infinite linear; z-index: 0; }
        @keyframes float { 0% { transform: translateY(100vh) rotate(0deg); } 100% { transform: translateY(-100px) rotate(360deg); } }

        .start-screen { justify-content: center; align-items: center; text-align: center; padding: 20px; z-index: 10; }
        .logo-main { font-size: 68px; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 0 0 50px rgba(139, 92, 246, 0.7); margin-bottom: 5px; }
        .logo-sub { font-size: 13px; letter-spacing: 7px; color: #71717a; text-transform: uppercase; margin-bottom: 30px; }
        .start-desc { color: #a1a1aa; font-size: 15px; line-height: 1.6; margin-bottom: 40px; max-width: 300px; }
        
        .start-btn {
            background: linear-gradient(180deg, #8b5cf6, #6d28d9); color: white; border: none; border-radius: 16px;
            font-size: 18px; font-weight: 700; padding: 20px; width: 100%; max-width: 300px; cursor: pointer;
            box-shadow: 0 8px 0 #4c1d95; display: block; margin: 0 auto; text-align: center; text-decoration: none;
        }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #4c1d95; }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; flex-shrink: 0; z-index: 5; }
        .back-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; color: #a1a1aa; font-size: 20px; cursor: pointer; text-decoration: none; }
        .progress-container { flex: 1; margin: 0 15px; height: 6px; background: #27272a; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff007f, #8b5cf6); width: 20%; border-radius: 3px; }
        .progress-text { font-size: 13px; color: #71717a; font-weight: 800; }

        .form-container { flex: 1; padding: 10px 20px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; z-index: 2; width: 100%; }
        .step-title { font-size: 26px; font-weight: 800; margin-bottom: 10px; color: #fff; font-family: 'Georgia', serif; text-align: left; }
        .step-desc { font-size: 14px; color: #a1a1aa; margin-bottom: 25px; line-height: 1.5; text-align: left; }

        .checkbox-card { display: flex; align-items: center; gap: 15px; background: rgba(24, 24, 27, 0.8); border: 1px solid #3f3f46; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        .checkbox-box { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #52525b; display: flex; justify-content: center; align-items: center; background: #8b5cf6; border-color: #8b5cf6; }
        .checkbox-box svg { width: 16px; height: 16px; fill: white; }
        .checkbox-text { font-size: 15px; color: #e4e4e7; font-weight: 600; }

        .input-group { margin-bottom: 20px; width: 100%; }
        .input-label { font-size: 11px; color: #71717a; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: 800; }
        .text-input { width: 100%; background: rgba(24, 24, 27, 0.8); border: 1px solid #3f3f46; color: #fff; padding: 15px; border-radius: 12px; font-size: 15px; outline: none; }

        .bottom-actions { margin-top: auto; padding-top: 20px; display: flex; gap: 12px; flex-shrink: 0; z-index: 5; width: 100%; }
        .btn { border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; text-decoration: none; padding: 18px; }
        .btn-primary { background: linear-gradient(180deg, #8b5cf6, #6d28d9); color: white; box-shadow: 0 5px 0 #4c1d95; }
        .btn-primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #4c1d95; }
        .btn-secondary { background: rgba(24, 24, 27, 0.8); color: #e4e4e7; border: 1px solid #3f3f46; box-shadow: 0 5px 0 #09090b; }
        .btn-secondary:active { transform: translateY(3px); box-shadow: 0 1px 0 #09090b; }
        .btn-half { flex: 1; }
    </style>
</head>
<body>

    <div class="bg-emoji" style="left: 10%;">🎮</div>
    <div class="bg-emoji" style="left: 30%; animation-delay: 2s;">🏆</div>
    <div class="bg-emoji" style="left: 70%; animation-delay: 4s;">💬</div>

    <!-- РАДИО-КНОПКИ ДЛЯ УПРАВЛЕНИЯ ЭКРАНАМИ (СКРЫТЫ) -->
    <input type="radio" name="screen" id="step0" checked>
    <input type="radio" name="screen" id="step1">
    <input type="radio" name="screen" id="step2">
    <input type="radio" name="screen" id="step3">
    <input type="radio" name="screen" id="step4">
    <input type="radio" name="screen" id="step5">

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div class="screen start-screen" id="screen0">
        <div class="logo-main">LFG</div>
        <div class="logo-sub">Looking for group</div>
        <div class="start-desc">Найди своих идеальных напарников для игр.</div>
        <!-- Кнопка, которая включает step1 -->
        <label for="step1" class="start-btn">Создать анкету</label>
    </div>

    <!-- ЭТАП 1 -->
    <div class="screen" id="screen1">
        <div class="header">
            <label for="step0" class="back-btn">←</label>
            <div class="progress-container"><div class="progress-bar" style="width: 20%;"></div></div>
            <span class="progress-text">1/5</span>
        </div>
        <div class="form-container">
            <div class="step-title">Правила</div>
            <div class="step-desc">Ознакомься с правилами.</div>
            <div class="checkbox-card">
                <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                <div class="checkbox-text">Я согласен</div>
            </div>
            <div class="bottom-actions">
                <!-- Кнопка на step2 -->
                <label for="step2" class="btn btn-primary btn-half" style="width: 100%;">Далее</label>
            </div>
        </div>
    </div>

    <!-- ЭТАП 2 -->
    <div class="screen" id="screen2">
        <div class="header">
            <label for="step1" class="back-btn">←</label>
            <div class="progress-container"><div class="progress-bar" style="width: 40%;"></div></div>
            <span class="progress-text">2/5</span>
        </div>
        <div class="form-container">
            <div class="step-title">Ник</div>
            <div class="step-desc">Введи свой ник.</div>
            <div class="input-group"><label class="input-label">Ник</label><input type="text" class="text-input" placeholder="Ник"></div>
            <div class="bottom-actions">
                <label for="step3" class="btn btn-primary btn-half" style="width: 100%;">Далее</label>
            </div>
        </div>
    </div>

    <!-- ЭТАП 3 -->
    <div class="screen" id="screen3">
        <div class="header">
            <label for="step2" class="back-btn">←</label>
            <div class="progress-container"><div class="progress-bar" style="width: 60%;"></div></div>
            <span class="progress-text">3/5</span>
        </div>
        <div class="form-container">
            <div class="step-title">Игра</div>
            <div class="step-desc">Выбери игру.</div>
            <div class="games-grid">
                <div class="game-card"><div class="game-name">CS2</div></div>
                <div class="game-card"><div class="game-name">Dota 2</div></div>
            </div>
            <div class="bottom-actions">
                <label for="step4" class="btn btn-primary btn-half" style="width: 100%;">Далее</label>
            </div>
        </div>
    </div>

    <!-- ЭТАП 4 -->
    <div class="screen" id="screen4">
        <div class="header">
            <label for="step3" class="back-btn">←</label>
            <div class="progress-container"><div class="progress-bar" style="width: 80%;"></div></div>
            <span class="progress-text">4/5</span>
        </div>
        <div class="form-container">
            <div class="step-title">Страна</div>
            <div class="step-desc">Твоя страна.</div>
            <div class="country-grid">
                <div class="country-btn">Россия</div>
                <div class="country-btn">Беларусь</div>
            </div>
            <div class="bottom-actions">
                <label for="step5" class="btn btn-primary btn-half" style="width: 100%;">Далее</label>
            </div>
        </div>
    </div>

    <!-- ЭТАП 5 -->
    <div class="screen" id="screen5">
        <div class="header">
            <label for="step4" class="back-btn">←</label>
            <div class="progress-container"><div class="progress-bar" style="width: 100%;"></div></div>
            <span class="progress-text">5/5</span>
        </div>
        <div class="form-container">
            <div class="step-title">Готово!</div>
            <div class="step-desc">Ты молодец.</div>
            <div class="bottom-actions">
                <label for="step0" class="btn btn-primary btn-half" style="width: 100%;">В начало</label>
            </div>
        </div>
    </div>

</body>
</html>
