<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LFG | Looking For Group</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: #e4e4e7;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 170, 0.1), transparent 25%);
        }

        /* --- АНИМАЦИЯ ЭКРАНОВ --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            transition: opacity 0.4s ease, transform 0.4s ease;
            z-index: 1;
        }
        
        /* Скрытый экран уезжает вправо и исчезает */
        .screen.hidden {
            opacity: 0;
            transform: translateX(20%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- СТАРТОВЫЙ ЭКРАН --- */
        .start-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .logo-main {
            font-size: 64px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.6);
            margin-bottom: 5px;
        }
        .logo-sub {
            font-size: 12px;
            letter-spacing: 6px;
            color: #71717a;
            text-transform: uppercase;
            margin-bottom: 30px;
        }
        .start-desc {
            color: #a1a1aa;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 320px;
        }
        
        /* 3D Кнопка */
        .start-btn {
            background: linear-gradient(180deg, #8b5cf6, #6d28d9);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            padding: 20px;
            width: 100%;
            max-width: 320px;
            cursor: pointer;
            box-shadow: 0 8px 0 #4c1d95, 0 15px 30px rgba(0,0,0,0.6);
            transition: transform 0.1s, box-shadow 0.1s;
            user-select: none;
        }
        .start-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #4c1d95, 0 5px 10px rgba(0,0,0,0.6);
        }

        /* --- ШАПКА АНКЕТЫ --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            flex-shrink: 0;
        }
        .back-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            width: 44px; height: 44px;
            display: flex; justify-content: center; align-items: center;
            color: #a1a1aa;
            font-size: 22px;
            cursor: pointer;
        }
        .back-btn:active { background: rgba(255,255,255,0.15); }
        
        .progress-container { flex: 1; margin: 0 15px; height: 8px; background: #27272a; border-radius: 4px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff007f, #8b5cf6); width: 33%; transition: width 0.4s ease; border-radius: 4px; }
        .progress-text { font-size: 14px; color: #71717a; font-weight: 800; }

        /* --- КОНТЕНТ АНКЕТЫ --- */
        .form-container {
            flex: 1;
            padding: 10px 20px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .step-title { font-size: 30px; font-weight: 800; margin-bottom: 10px; color: #fff; line-height: 1.2; }
        .step-desc { font-size: 15px; color: #a1a1aa; margin-bottom: 30px; line-height: 1.5; }

        /* Карточки правил */
        .rule-card {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
        }
        .rule-card h3 { color: #8b5cf6; font-size: 16px; margin-bottom: 12px; }
        .rule-list { list-style: none; padding: 0; }
        .rule-list li { font-size: 14px; color: #d4d4d8; margin-bottom: 12px; padding-left: 20px; position: relative; }
        .rule-list li::before { content: '✦'; color: #8b5cf6; position: absolute; left: 0; font-size: 14px; }

        /* Чекбокс */
        .checkbox-card {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #3f3f46;
            padding: 20px;
            border-radius: 16px;
            cursor: pointer;
            transition: 0.2s;
        }
        .checkbox-card.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }
        .checkbox-box {
            width: 28px; height: 28px;
            border-radius: 8px;
            border: 2px solid #52525b;
            display: flex; justify-content: center; align-items: center;
            transition: 0.2s;
        }
        .checkbox-card.active .checkbox-box { background: #8b5cf6; border-color: #8b5cf6; }
        .checkbox-box svg { width: 18px; height: 18px; fill: white; display: none; }
        .checkbox-card.active .checkbox-box svg { display: block; }
        .checkbox-text { font-size: 16px; color: #e4e4e7; font-weight: 600; }

        /* Поля ввода */
        .input-group { margin-bottom: 25px; }
        .input-label { font-size: 12px; color: #71717a; text-transform: uppercase; margin-bottom: 10px; display: block; font-weight: 800; letter-spacing: 1px; }
        .text-input {
            width: 100%;
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #3f3f46;
            color: #fff;
            padding: 18px;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
        }
        .text-input:focus { border-color: #8b5cf6; }

        /* Игры */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
        .game-card {
            background: rgba(24, 24, 27, 0.8);
            border: 1px solid #27272a;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.15); }
        .game-icon { width: 44px; height: 44px; background: #27272a; border-radius: 12px; display: flex; justify-content: center; align-items: center; }
        .game-card.active .game-icon { background: #8b5cf6; }
        .game-icon svg { width: 24px; height: 24px; fill: #a1a1aa; }
        .game-card.active .game-icon svg { fill: white; }
        .game-name { font-size: 14px; font-weight: 700; color: #e4e4e7; }

        /* Ползунок */
        .rank-slider-container {
            display: none;
            background: rgba(24, 24, 27, 0.9);
            border: 1px solid #8b5cf6;
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 16px;
        }
        .rank-slider-container.active { display: block; }
        .rank-title { font-size: 14px; color: #a1a1aa; margin-bottom: 15px; text-align: center; }
        .rank-value { font-size: 24px; font-weight: 900; color: #fff; text-align: center; margin-bottom: 15px; text-shadow: 0 0 15px rgba(139, 92, 246, 0.8); }
        .range-slider { -webkit-appearance: none; width: 100%; height: 10px; background: #27272a; border-radius: 5px; outline: none; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: #fff; border-radius: 50%; border: 4px solid #8b5cf6; cursor: pointer; }

        /* Низ формы */
        .bottom-actions { margin-top: auto; padding-top: 20px; display: flex; gap: 12px; flex-shrink: 0; }
        .btn { border: none; border-radius: 16px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.1s, box-shadow 0.1s; user-select: none; }
        .btn:active { transform: translateY(4px); }
        .btn-primary { background: linear-gradient(180deg, #8b5cf6, #6d28d9); color: white; box-shadow: 0 6px 0 #4c1d95; padding: 20px; }
        .btn-primary:active { box-shadow: 0 1px 0 #4c1d95; }
        .btn-secondary { background: rgba(24, 24, 27, 0.8); color: #e4e4e7; border: 1px solid #3f3f46; box-shadow: 0 6px 0 #09090b; padding: 20px; }
        .btn-secondary:active { box-shadow: 0 1px 0 #09090b; }
        .btn-half { flex: 1; }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div class="screen start-screen" id="startScreen">
        <div class="logo-main">LFG</div>
        <div class="logo-sub">Looking for group</div>
        <div class="start-desc">
            Найди своих идеальных напарников для игр. Укажи ранг, выбери платформу и общайся с теми, кто разделяет твои интересы.
        </div>
        <button class="start-btn" onclick="goToForm()">Создать анкету</button>
    </div>

    <!-- ЭКРАН АНКЕТЫ -->
    <div class="screen hidden" id="regScreen">
        <div class="header">
            <button class="back-btn" onclick="prevStep()">←</button>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <span class="progress-text" id="progressText">1/3</span>
        </div>
        
        <div class="form-container" id="formContainer">
            <!-- Сюда рендерятся шаги -->
        </div>

        <div class="bottom-actions" id="bottomActions">
            <!-- Кнопки навигации -->
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        let currentStep = 1;
        const totalSteps = 3;

        // ПЕРЕХОД НА ФОРМУ
        function goToForm() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('regScreen').classList.remove('hidden');
            currentStep = 1;
            renderStep();
        }

        // НАВИГАЦИЯ ДАЛЕЕ/НАЗАД
        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            } else {
                if (tg) tg.showAlert("Анкета создана!");
                location.reload();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                renderStep();
            } else {
                document.getElementById('regScreen').classList.add('hidden');
                document.getElementById('startScreen').classList.remove('hidden');
            }
        }

        // РЕНДЕР ШАГОВ
        function renderStep() {
            const formContainer = document.getElementById('formContainer');
            const bottomActions = document.getElementById('bottomActions');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            // Обновляем прогресс
            progressBar.style.width = `${(currentStep / totalSteps) * 100}%`;
            progressText.innerText = `${currentStep}/${totalSteps}`;

            formContainer.innerHTML = '';
            bottomActions.innerHTML = '';

            // ШАГ 1
            if (currentStep === 1) {
                formContainer.innerHTML = `
                    <div class="step-title">Правила проекта</div>
                    <div class="step-desc">Ознакомься с правилами перед созданием анкеты.</div>
                    <div class="rule-card">
                        <h3>1. Уважение</h3>
                        <ul class="rule-list">
                            <li>Общайтесь вежливо, без токсичности.</li>
                            <li>Запрещена дискриминация.</li>
                        </ul>
                    </div>
                    <div class="checkbox-card" onclick="this.classList.toggle('active')">
                        <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="checkbox-text">Я согласен с правилами</div>
                    </div>
                `;
                bottomActions.innerHTML = `<button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>`;
            } 
            // ШАГ 2
            else if (currentStep === 2) {
                formContainer.innerHTML = `
                    <div class="step-title">Твои данные</div>
                    <div class="step-desc">Как тебя будут видеть другие игроки.</div>
                    <div class="input-group">
                        <label class="input-label">Никнейм</label>
                        <input type="text" class="text-input" placeholder="Введи ник">
                    </div>
                `;
                bottomActions.innerHTML = `
                    <button class="btn btn-secondary btn-half" onclick="prevStep()">Назад</button>
                    <button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>
                `;
            }
            // ШАГ 3
            else if (currentStep === 3) {
                formContainer.innerHTML = `
                    <div class="step-title">Выбери игру</div>
                    <div class="step-desc">В какой игре ищешь напарников?</div>
                    <div class="games-grid">
                        <div class="game-card" onclick="toggleGame(this, 'cs2')">
                            <div class="game-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
                            <div class="game-name">CS2</div>
                        </div>
                        <div class="game-card" onclick="toggleGame(this, 'dota')">
                            <div class="game-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
                            <div class="game-name">Dota 2</div>
                        </div>
                    </div>
                    <div class="rank-slider-container" id="cs2Rank">
                        <div class="rank-title">Твой ранг в CS2:</div>
                        <div class="rank-value" id="cs2Value">Уровень 1</div>
                        <input type="range" class="range-slider" min="1" max="10" value="1" oninput="document.getElementById('cs2Value').innerText = 'Уровень ' + this.value">
                    </div>
                `;
                bottomActions.innerHTML = `
                    <button class="btn btn-secondary btn-half" onclick="prevStep()">Назад</button>
                    <button class="btn btn-primary btn-half" onclick="nextStep()">Завершить</button>
                `;
            }
        }

        // ЛОГИКА ВЫБОРА ИГРЫ
        function toggleGame(el, gameId) {
            el.classList.toggle('active');
            if (gameId === 'cs2') {
                document.getElementById('cs2Rank').classList.toggle('active', el.classList.contains('active'));
            }
        }
    </script>
</body>
</html>
