<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LFG | Looking For Group</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: #e4e4e7;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 170, 0.08), transparent 25%);
        }

        /* --- АНИМАЦИЯ ЭКРАНОВ --- */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 1;
        }
        .screen.hidden {
            opacity: 0;
            transform: translateX(15%);
            pointer-events: none;
            z-index: 0;
        }

        /* --- СТАРТОВЫЙ ЭКРАН --- */
        .start-screen { justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .logo-main {
            font-size: 68px; font-weight: 900; letter-spacing: 4px; color: #fff;
            text-shadow: 0 0 50px rgba(139, 92, 246, 0.7); margin-bottom: 5px;
        }
        .logo-sub { font-size: 13px; letter-spacing: 7px; color: #71717a; text-transform: uppercase; margin-bottom: 30px; }
        .start-desc { color: #a1a1aa; font-size: 15px; line-height: 1.6; margin-bottom: 40px; max-width: 300px; }
        
        .start-btn {
            background: linear-gradient(180deg, #8b5cf6, #6d28d9); color: white; border: none; border-radius: 16px;
            font-size: 18px; font-weight: 700; padding: 20px; width: 100%; max-width: 320px; cursor: pointer;
            box-shadow: 0 8px 0 #4c1d95, 0 15px 30px rgba(0,0,0,0.6); transition: transform 0.1s, box-shadow 0.1s; user-select: none;
        }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #4c1d95, 0 5px 10px rgba(0,0,0,0.6); }

        /* --- ШАПКА --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; flex-shrink: 0; }
        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
            width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;
            color: #a1a1aa; font-size: 20px; cursor: pointer; transition: 0.2s;
        }
        .back-btn:active { background: rgba(255,255,255,0.15); transform: scale(0.9); }
        .progress-container { flex: 1; margin: 0 15px; height: 6px; background: #27272a; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff007f, #8b5cf6); width: 16%; transition: width 0.4s ease; border-radius: 3px; }
        .progress-text { font-size: 13px; color: #71717a; font-weight: 800; }

        /* --- КОНТЕНТ --- */
        .form-container { flex: 1; padding: 10px 20px 20px 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .step-title { font-size: 26px; font-weight: 800; margin-bottom: 10px; color: #fff; line-height: 1.2; }
        .step-desc { font-size: 14px; color: #a1a1aa; margin-bottom: 25px; line-height: 1.5; }

        /* Чекбокс */
        .checkbox-card {
            display: flex; align-items: center; gap: 15px; background: rgba(24, 24, 27, 0.8);
            border: 1px solid #3f3f46; padding: 20px; border-radius: 16px; cursor: pointer; transition: 0.2s;
        }
        .checkbox-card.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }
        .checkbox-box { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #52525b; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .checkbox-card.active .checkbox-box { background: #8b5cf6; border-color: #8b5cf6; }
        .checkbox-box svg { width: 16px; height: 16px; fill: white; display: none; }
        .checkbox-card.active .checkbox-box svg { display: block; }
        .checkbox-text { font-size: 15px; color: #e4e4e7; font-weight: 600; }

        /* Поля ввода */
        .input-group { margin-bottom: 20px; }
        .input-label { font-size: 11px; color: #71717a; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: 800; }
        .text-input {
            width: 100%; background: rgba(24, 24, 27, 0.8); border: 1px solid #3f3f46; color: #fff;
            padding: 15px; border-radius: 12px; font-size: 15px; outline: none; transition: 0.2s;
        }
        .text-input:focus { border-color: #8b5cf6; }

        /* Игры */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .game-card {
            background: rgba(24, 24, 27, 0.8); border: 1px solid #27272a; border-radius: 14px;
            padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s;
        }
        .game-card.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.15); }
        .game-icon { width: 36px; height: 36px; background: #27272a; border-radius: 10px; display: flex; justify-content: center; align-items: center; }
        .game-card.active .game-icon { background: #8b5cf6; }
        .game-icon svg { width: 20px; height: 20px; fill: #a1a1aa; }
        .game-card.active .game-icon svg { fill: white; }
        .game-name { font-size: 13px; font-weight: 700; color: #e4e4e7; text-align: center; }

        /* Ползунок ранга */
        .rank-slider-container {
            display: none; background: rgba(24, 24, 27, 0.9); border: 1px solid #8b5cf6;
            padding: 15px; border-radius: 14px; margin-bottom: 12px;
        }
        .rank-slider-container.active { display: block; }
        .rank-title { font-size: 13px; color: #a1a1aa; margin-bottom: 10px; text-align: center; }
        .rank-value { font-size: 18px; font-weight: 900; color: #fff; text-align: center; margin-bottom: 10px; }
        .range-slider { -webkit-appearance: none; width: 100%; height: 8px; background: #27272a; border-radius: 4px; outline: none; }
        .range-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #fff; border-radius: 50%; border: 3px solid #8b5cf6; cursor: pointer; }

        /* Страны */
        .country-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .country-btn {
            background: rgba(24, 24, 27, 0.8); border: 1px solid #3f3f46; color: #e4e4e7;
            padding: 15px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.2s;
        }
        .country-btn.active { background: #8b5cf6; border-color: #8b5cf6; color: white; }

        /* Фото */
        .photo-upload-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .photo-box {
            aspect-ratio: 1; background: rgba(24, 24, 27, 0.8); border: 2px dashed #3f3f46;
            border-radius: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; color: #52525b; transition: 0.2s;
        }
        .photo-box.active { background: rgba(139, 92, 246, 0.1); border-color: #8b5cf6; color: #8b5cf6; }
        .photo-box svg { width: 30px; height: 30px; fill: currentColor; margin-bottom: 5px; }
        .photo-box span { font-size: 12px; }

        /* Стиль */
        .style-grid { display: flex; flex-direction: column; gap: 10px; }
        .style-btn {
            background: rgba(24, 24, 27, 0.8); border: 1px solid #3f3f46; color: #e4e4e7;
            padding: 18px; border-radius: 14px; font-size: 15px; font-weight: 600; text-align: left; cursor: pointer; transition: 0.2s;
        }
        .style-btn.active { background: #8b5cf6; border-color: #8b5cf6; color: white; }

        /* Низ формы */
        .bottom-actions { margin-top: auto; padding-top: 20px; display: flex; gap: 12px; flex-shrink: 0; }
        .btn { border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.1s, box-shadow 0.1s; user-select: none; }
        .btn:active { transform: translateY(3px); }
        .btn-primary { background: linear-gradient(180deg, #8b5cf6, #6d28d9); color: white; box-shadow: 0 5px 0 #4c1d95; padding: 18px; }
        .btn-primary:active { box-shadow: 0 1px 0 #4c1d95; }
        .btn-secondary { background: rgba(24, 24, 27, 0.8); color: #e4e4e7; border: 1px solid #3f3f46; box-shadow: 0 5px 0 #09090b; padding: 18px; }
        .btn-secondary:active { box-shadow: 0 1px 0 #09090b; }
        .btn-half { flex: 1; }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div class="screen start-screen" id="startScreen">
        <div class="logo-main">LFG</div>
        <div class="logo-sub">Looking for group</div>
        <div class="start-desc">
            Найди своих идеальных напарников для игр. Укажи ранг, выбери платформу и общайся с теми, кто разделяет твои интересы.
        </div>
        <button class="start-btn" id="btnStart">Создать анкету</button>
    </div>

    <!-- ЭКРАН АНКЕТЫ -->
    <div class="screen hidden" id="regScreen">
        <div class="header">
            <button class="back-btn" id="btnBack">←</button>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <span class="progress-text" id="progressText">1/6</span>
        </div>
        
        <div class="form-container" id="formContainer"></div>
        <div class="bottom-actions" id="bottomActions"></div>
    </div>

    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        // Переменные
        let currentStep = 1;
        const totalSteps = 6;
        const startScreen = document.getElementById('startScreen');
        const regScreen = document.getElementById('regScreen');
        const formContainer = document.getElementById('formContainer');
        const bottomActions = document.getElementById('bottomActions');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        // Данные игр
        const gamesData = [
            { id: 'cs2', name: 'CS2', icon: 'M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z', ranks: ['Silver', 'Gold', 'MG', 'DMG', 'Faceit 1', 'Faceit 10', 'Global'] },
            { id: 'dota', name: 'Dota 2', icon: 'M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5', ranks: ['Herald', 'Guardian', 'Crusader', 'Archon', 'Legend', 'Ancient', 'Divine', 'Immortal'] },
            { id: 'val', name: 'Valorant', icon: 'M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z', ranks: ['Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Ascendant', 'Immortal', 'Radiant'] },
            { id: 'apex', name: 'Apex Legends', icon: 'M12 2L2 22h20L12 2z', ranks: ['Rookie', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Diamond', 'Master', 'Predator'] },
            { id: 'pubg', name: 'PUBG', icon: 'M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z' },
            { id: 'lol', name: 'LoL', icon: 'M12 2L2 22h20L12 2z', ranks: ['Iron', 'Bronze', 'Silver', 'Gold', 'Platinum', 'Emerald', 'Diamond', 'Master', 'Challenger'] },
            { id: 'mine', name: 'Minecraft', icon: 'M4 4h16v16H4z' },
            { id: 'gta', name: 'GTA V', icon: 'M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z' },
            { id: 'rust', name: 'Rust', icon: 'M12 2L2 22h20L12 2z', ranks: ['Scrap', 'Wood', 'Stone', 'Metal', 'HQM'] },
            { id: 'tarkov', name: 'Tarkov', icon: 'M12 2L2 22h20L12 2z' }
        ];

        const citiesData = ["Москва", "Санкт-Петербург", "Минск", "Киев", "Алматы", "Африка", "Австралия"];

        // --- ИНИЦИАЛИЗАЦИЯ СОБЫТИЙ ---
        document.getElementById('btnStart').addEventListener('click', () => {
            startScreen.classList.add('hidden');
            regScreen.classList.remove('hidden');
            currentStep = 1;
            renderStep();
        });

        document.getElementById('btnBack').addEventListener('click', () => {
            if (currentStep > 1) {
                currentStep--;
                renderStep();
            } else {
                regScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
            }
        });

        // --- ФУНКЦИИ НАВИГАЦИИ ---
        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            } else {
                if (tg) tg.showAlert("Анкета успешно создана!");
                else alert("Анкета успешно создана!");
                location.reload();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                renderStep();
            } else {
                regScreen.classList.add('hidden');
                startScreen.classList.remove('hidden');
            }
        }

        // --- РЕНДЕР ---
        function renderStep() {
            progressBar.style.width = `${(currentStep / totalSteps) * 100}%`;
            progressText.innerText = `${currentStep}/${totalSteps}`;
            formContainer.innerHTML = '';
            bottomActions.innerHTML = '';

            if (currentStep === 1) {
                formContainer.innerHTML = `
                    <div class="step-title">Правила проекта</div>
                    <div class="step-desc">Ознакомься с правилами перед созданием анкеты.</div>
                    <div class="checkbox-card" onclick="this.classList.toggle('active')">
                        <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="checkbox-text">Я согласен с правилами</div>
                    </div>
                `;
                bottomActions.innerHTML = `<button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>`;
            } 
            else if (currentStep === 2) {
                formContainer.innerHTML = `
                    <div class="step-title">Твои данные</div>
                    <div class="step-desc">Как тебя будут видеть другие игроки.</div>
                    <div class="input-group"><label class="input-label">Никнейм</label><input type="text" class="text-input" placeholder="Введи ник"></div>
                    <div class="input-group"><label class="input-label">Дата рождения</label><input type="date" class="text-input"></div>
                `;
                bottomActions.innerHTML = `
                    <button class="btn btn-secondary btn-half" onclick="prevStep()">Назад</button>
                    <button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>
                `;
            }
            else if (currentStep === 3) {
                let gamesHTML = gamesData.map(game => `
                    <div class="game-card" onclick="toggleGame(this, '${game.id}')" id="card-${game.id}">
                        <div class="game-icon"><svg viewBox="0 0 24 24"><path d="${game.icon}"/></svg></div>
                        <div class="game-name">${game.name}</div>
                    </div>
                `).join('');
                formContainer.innerHTML = `
                    <div class="step-title">Во что играешь?</div>
                    <div class="step-desc">Выбери игры, чтобы найти общие интересы.</div>
                    <div class="games-grid">${gamesHTML}</div>
                    <div id="rankSlidersContainer"></div>
                `;
                bottomActions.innerHTML = `
                    <button class="btn btn-secondary btn-half" onclick="prevStep()">Назад</button>
                    <button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>
                `;
            }
            else if (currentStep === 4) {
                formContainer.innerHTML = `
                    <div class="step-title">Откуда ты?</div>
                    <div class="step-desc">Выбери страну, чтобы мы могли подобрать людей поблизости.</div>
                    <div class="country-grid">
                        <div class="country-btn" onclick="selectCountry(this)">Россия</div>
                        <div class="country-btn" onclick="selectCountry(this)">Беларусь</div>
                        <div class="country-btn" onclick="selectCountry(this)">Украина</div>
                        <div class="country-btn" onclick="selectCountry(this)">Казахстан</div>
                        <div class="country-btn" style="grid-column: span 2;" onclick="selectCountry(this, true)">Другая</div>
                    </div>
                    <div id="cityInputContainer" style="display: none;">
                        <div class="input-group"><label class="input-label">Твой город</label><input type="text" class="text-input" id="cityInput" placeholder="Начни вводить город..." oninput="showCitySuggestions(this.value)"></div>
                        <div id="citySuggestions" style="background: #18181b; border-radius: 12px; overflow: hidden;"></div>
                    </div>
                `;
                bottomActions.innerHTML = `
                    <button class="btn btn-secondary btn-half" onclick="prevStep()">Назад</button>
                    <button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>
                `;
            }
            else if (currentStep === 5) {
                formContainer.innerHTML = `
                    <div class="step-title">Добавь фото</div>
                    <div class="step-desc">Загрузи до 4-х фотографий, чтобы другим было проще с тобой познакомиться.</div>
                    <div class="photo-upload-grid">
                        <div class="photo-box" onclick="togglePhoto(this)"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/></svg><span>Загрузить</span></div>
                        <div class="photo-box" onclick="togglePhoto(this)"><svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/></svg><span>Загрузить</span></div>
                    </div>
                `;
                bottomActions.innerHTML = `
                    <button class="btn btn-secondary btn-half" onclick="prevStep()">Назад</button>
                    <button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>
                `;
            }
            else if (currentStep === 6) {
                formContainer.innerHTML = `
                    <div class="step-title">Как
