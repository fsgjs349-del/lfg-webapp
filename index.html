<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DOUBLEMID — поиск тиммейтов</title>
<style>
:root{--bg:#0d0b15;--teal:#2fe6c8;--pink:#ff5c8a;--text:#eef;--muted:#8b87a3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;color:var(--text);
  background:radial-gradient(1000px 700px at 85% -10%,#2a1f4d 0%,transparent 55%),
             radial-gradient(900px 700px at -10% 110%,#123a3a 0%,transparent 55%),var(--bg);
  display:flex;flex-direction:column;overflow:hidden;user-select:none}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.close{background:none;border:none;color:var(--text);font-size:15px;cursor:pointer;opacity:.85}
.logo{font-weight:800;letter-spacing:2px;font-size:20px;
  background:linear-gradient(90deg,#ff8ad4,#b28bff,#2fe6c8);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.tabs{display:flex;gap:8px;padding:10px 14px}
.tabs button{border:none;background:#1c1930;color:#c9c5e0;font-weight:700;font-size:13px;
  padding:10px 16px;border-radius:999px;cursor:pointer;letter-spacing:.5px}
.tabs button.active{background:var(--teal);color:#06231e}
main{flex:1;display:flex;flex-direction:column;align-items:center;padding:4px 14px 0;min-height:0}
#stack{position:relative;width:100%;max-width:400px;flex:1;max-height:620px}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:#161321;
  border:1px solid #2ee6c844;box-shadow:0 12px 40px #000a;touch-action:none;will-change:transform;cursor:grab}
.card:active{cursor:grabbing}
.photo{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;cursor:pointer}
.bars{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:6px;z-index:3}
.bars i{flex:1;height:4px;border-radius:4px;background:#ffffff42}
.bars i.on{background:#fff}
.chip-game{position:absolute;top:22px;right:14px;background:var(--teal);color:#04211c;
  font-weight:700;font-size:13px;padding:7px 12px;border-radius:999px;z-index:3}
.info{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 16px;z-index:3;
  background:linear-gradient(180deg,transparent,rgba(5,4,10,.9) 40%)}
.tag{display:inline-block;border:1px solid #e8c96a66;color:#e8c96a;font-size:12px;padding:4px 10px;border-radius:999px;margin-bottom:8px}
.name{font-size:30px;font-weight:800}
.name span{color:var(--teal)}
.meta{display:flex;align-items:center;gap:10px;font-size:15px;margin-top:4px}
.meta b{color:#ffffff55;font-weight:400}
.game-row{display:flex;gap:8px;margin-top:10px}
.game{display:flex;gap:8px;background:#0f2c28cc;border:1px solid var(--teal);padding:6px 12px;border-radius:14px;font-weight:700}
.game small{color:#9fe9dc;font-weight:600}
.plus{background:#ffffff1c;padding:6px 12px;border-radius:12px;font-weight:700}
.stamp{position:absolute;top:34px;padding:8px 18px;font-size:28px;font-weight:900;letter-spacing:2px;
  border:4px solid;border-radius:12px;opacity:0;z-index:4;pointer-events:none}
.s-like{left:20px;color:var(--teal);border-color:var(--teal);transform:rotate(-18deg)}
.s-nope{right:20px;color:var(--pink);border-color:var(--pink);transform:rotate(18deg)}
.actions{display:flex;align-items:center;justify-content:center;gap:16px;padding:16px 0 10px}
.actions button{border:none;border-radius:50%;cursor:pointer;display:grid;place-items:center;
  color:var(--text);position:relative;transition:transform .12s}
.actions button:active{transform:scale(.88)}
.btn-sm{width:52px;height:52px;background:#1c1930;font-size:20px}
.btn-lg{width:74px;height:74px;font-size:30px}
#nope{background:#2a1220;color:var(--pink);box-shadow:0 6px 20px #ff5c8a33}
#like{background:var(--teal);color:#04211c;font-size:34px;box-shadow:0 8px 26px #2fe6c855}
.dot{position:absolute;top:-2px;right:-2px;width:20px;height:20px;border-radius:50%;background:var(--teal);
  color:#04211c;font-size:12px;font-weight:800;display:grid;place-items:center}
nav{display:flex;justify-content:space-around;padding:10px 6px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #ffffff12}
nav div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
nav .on{color:#c9a6ff}
nav b{position:absolute;top:-6px;right:2px;background:#4b3d75;color:#fff;font-size:10px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
#modal{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50}
#modal .box{background:#181428;border:1px solid #2ee6c844;border-radius:20px;padding:20px;width:90%;max-width:340px}
#modal h3{margin-bottom:12px;font-size:17px}
#modal textarea{width:100%;height:90px;background:#0f0c1c;border:1px solid #ffffff22;border-radius:12px;color:#fff;padding:10px;resize:none}
#modal .row{display:flex;gap:10px;margin-top:12px}
#modal .row button{flex:1;padding:10px;border:none;border-radius:12px;font-weight:700;cursor:pointer}
#mSend{background:var(--teal);color:#04211c}
#mClose{background:#241f38;color:#c9c5e0}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--teal);color:#04211c;
  font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;z-index:60;pointer-events:none}
@media (max-height:700px){#stack{max-height:500px}.name{font-size:24px}}
</style>
</head>
<body>

<header><button class="close">✕ Закрыть</button><div class="logo">💜 DOUBLEMID</div></header>
<div class="tabs"><button>💜 НЯШКИ</button><button class="active">🎮 ТИММЕЙТЫ</button></div>

<main>
  <div id="stack"></div>
  <div class="actions">
    <button class="btn-sm" id="rewind">↩<span class="dot">3</span></button>
    <button class="btn-lg" id="nope">✕</button>
    <button class="btn-lg" id="like">✔</button>
    <button class="btn-sm" id="msg">✉<span class="dot">1</span></button>
  </div>
</main>

<nav>
  <div class="on">▣<b>Поиск</b></div><div>♡ Лайки</div><div>👥 Пати<b>5</b></div><div>💬 Чаты</div><div>👤 Профиль</div>
</nav>

<div id="modal" hidden><div class="box">
  <h3>Сообщение для <span id="mName"></span></h3>
  <textarea placeholder="Привет! Го катку?"></textarea>
  <div class="row"><button id="mSend">Отправить</button><button id="mClose">Закрыть</button></div>
</div></div>
<div id="toast">Отправлено ✓</div>

<script>
const P=[
 {n:'sqrtLY',a:21,g:'♂',c:'Москва',ic:'🖥️ 🤘 🍺',tag:'новенький',common:'1 общая игра',g1:'CS2',lvl:'7 LVL',plus:'+7',
  ph:[['linear-gradient(160deg,#23202e,#4a3560)','🎧'],['linear-gradient(160deg,#1d2e2c,#0e1618)','🎮']]},
 {n:'NeonFox',a:19,g:'♀',c:'Минск',ic:'🎨 🎮 🌙',tag:'тиммейт',common:'3 общие игры',g1:'Dota 2',lvl:'12 LVL',plus:'+4',
  ph:[['linear-gradient(160deg,#3a1e4d,#7a2f5a)','🦊'],['linear-gradient(160deg,#12233d,#1e4a4a)','🕹️']]},
 {n:'ShadowPeek',a:23,g:'♂',c:'Гродно',ic:'⚽ 🎧 🍕',tag:'новенький',common:'2 общие игры',g1:'Valorant',lvl:'9 LVL',plus:'+2',
  ph:[['linear-gradient(160deg,#20303a,#0d1420)','🐺'],['linear-gradient(160deg,#2e1e3a,#150d20)','👾']]}
];
const stack=document.getElementById('stack');
let shown=0,hist=[];
const top=()=>stack.firstElementChild;

function makeCard(p){
  const el=document.createElement('div');el.className='card';el.dataset.name=p.n;
  el.innerHTML=`
   <div class="photo" style="background:${p.ph[0][0]}">${p.ph[0][1]}</div>
   <div class="bars">${p.ph.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('')}</div>
   <div class="chip-game">🎮 ${p.common}</div>
   <div class="stamp s-like">ЛАЙК</div><div class="stamp s-nope">ДИЗЛАЙК</div>
   <div class="info"><span class="tag">${p.tag}</span>
     <div class="name">${p.n}, ${p.a} <span>${p.g}</span></div>
     <div class="meta">${p.c} <b>|</b> ${p.ic}</div>
     <div class="game-row"><div class="game">🎯 ${p.g1} <small>| ${p.lvl}</small></div><div class="plus">${p.plus}</div></div>
   </div>`;
  const photo=el.querySelector('.photo'),bars=[...el.querySelectorAll('.bars i')];let pi=0;
  photo.addEventListener('click',()=>{pi=(pi+1)%p.ph.length;
    photo.style.background=p.ph[pi][0];photo.textContent=p.ph[pi][1];
    bars.forEach((b,i)=>b.classList.toggle('on',i===pi));});
  drag(el);return el;
}
function refill(){while(stack.children.length<3&&shown<P.length)stack.append(makeCard(P[shown++]))}

function drag(el){
  let sx,sy,dx,dy,on=false;
  const like=el.querySelector('.s-like'),nope=el.querySelector('.s-nope');
  el.addEventListener('pointerdown',e=>{if(top()!==el)return;on=true;sx=e.clientX;sy=e.clientY;dx=dy=0;
    el.setPointerCapture(e.pointerId);el.style.transition='none'});
  el.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;dy=e.clientY-sy;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    like.style.opacity=dx>60?1:0;nope.style.opacity=dx<-60?1:0});
  const up=()=>{if(!on)return;on=false;
    el.style.transition='transform .35s cubic-bezier(.2,.8,.3,1)';
    if(dx>100)fly(el,1);else if(dx<-100)fly(el,-1);
    else{el.style.transform='';like.style.opacity=0;nope.style.opacity=0}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
function fly(el,dir){
  el.style.transition='transform .4s ease-in,opacity .4s';
  el.style.transform=`translate(${dir*640}px,-90px) rotate(${dir*32}deg)`;el.style.opacity='0';
  el.dataset.gone='1';hist.push(el);
  setTimeout(()=>{if(el.dataset.gone==='1')el.remove();refill()},380);
}

document.getElementById('like').onclick=()=>{const e=top();if(e)fly(e,1)};
document.getElementById('nope').onclick=()=>{const e=top();if(e)fly(e,-1)};
document.getElementById('rewind').onclick=()=>{const el=hist.pop();if(!el)return;
  if(stack.children.length>=3&&shown>=P.length)stack.lastElementChild.remove();
  el.dataset.gone='0';el.style.transition='none';el.style.transform='';el.style.opacity='1';
  el.querySelector('.s-like').style.opacity=0;el.querySelector('.s-nope').style.opacity=0;
  stack.prepend(el)};
const modal=document.getElementById('modal');
document.getElementById('msg').onclick=()=>{const e=top();document.getElementById('mName').textContent=e?e.dataset.name:'';
  modal.hidden=false};
document.getElementById('mClose').onclick=()=>modal.hidden=true;
document.getElementById('mSend').onclick=()=>{modal.hidden=true;const t=document.getElementById('toast');
  t.style.opacity=1;setTimeout(()=>t.style.opacity=0,1500)};

refill();
</script>
</body>
</html>
