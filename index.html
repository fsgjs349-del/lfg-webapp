<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LFG | Looking For Group</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #09090b; /* Очень темный фон */
            color: #e4e4e7;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- ОБЩИЕ СТИЛИ --- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #09090b;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 1;
        }
        .screen.hidden {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            flex-shrink: 0;
        }
        .back-btn {
            background: none;
            border: none;
            color: #a1a1aa;
            font-size: 24px;
            cursor: pointer;
        }
        .progress-text { font-size: 14px; color: #52525b; font-weight: 600; }

        /* --- СТАРТОВЫЙ ЭКРАН --- */
        .start-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .logo-main {
            font-size: 40px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 5px;
        }
        .logo-sub {
            font-size: 12px;
            letter-spacing: 4px;
            color: #71717a;
            text-transform: uppercase;
            margin-bottom: 50px;
        }
        .start-btn {
            background: #27272a;
            color: #fff;
            border: 1px solid #3f3f46;
            padding: 18px 40px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: background 0.2s;
        }
        .start-btn:active { background: #3f3f46; }

        /* --- ЭКРАН НАСТРОЕК (Шестеренка) --- */
        .settings-btn {
            position: absolute;
            right: 20px;
            top: 15px;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 15;
        }
        .settings-btn svg { width: 20px; height: 20px; fill: #a1a1aa; }

        /* --- ЭКРАН АНКЕТЫ (ФОРМА) --- */
        .form-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .step-title { font-size: 24px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .step-desc { font-size: 14px; color: #a1a1aa; margin-bottom: 25px; line-height: 1.4; }

        /* Поля ввода */
        .input-group { margin-bottom: 20px; }
        .input-label { font-size: 12px; color: #71717a; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: 600; letter-spacing: 1px; }
        .text-input {
            width: 100%;
            background: #18181b;
            border: 1px solid #27272a;
            color: #fff;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }
        .text-input:focus { border-color: #52525b; }

        /* Чекбоксы */
        .checkbox-card {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            background: #18181b;
            border: 1px solid #27272a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            cursor: pointer;
        }
        .checkbox-box {
            width: 24px; height: 24px;
            border-radius: 6px;
            border: 2px solid #3f3f46;
            display: flex; justify-content: center; align-items: center;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .checkbox-card.active .checkbox-box {
            background: #7c3aed; /* Приглушенный фиолетовый */
            border-color: #7c3aed;
        }
        .checkbox-box svg { width: 14px; height: 14px; fill: white; display: none; }
        .checkbox-card.active .checkbox-box svg { display: block; }
        .checkbox-text { font-size: 14px; color: #d4d4d8; line-height: 1.4; }

        /* Выбор игр (Сетка) */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .game-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card.active {
            border-color: #7c3aed;
            background: rgba(124, 58, 237, 0.1);
        }
        .game-icon {
            width: 32px; height: 32px;
            background: #27272a;
            border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
        }
        .game-icon svg { width: 20px; height: 20px; fill: #a1a1aa; }
        .game-name { font-size: 14px; font-weight: 600; color: #e4e4e7; }

        /* Ползунок ранга (появляется при выборе игры) */
        .rank-slider-container {
            display: none;
            background: #18181b;
            border: 1px solid #27272a;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        .rank-slider-container.active { display: block; }
        .rank-title { font-size: 14px; color: #a1a1aa; margin-bottom: 10px; }
        .rank-value { font-size: 18px; font-weight: bold; color: #fff; text-align: center; margin-bottom: 10px; }
        .range-slider {
            -webkit-appearance: none; width: 100%; height: 6px; background: #27272a; border-radius: 3px; outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 20px; height: 20px; background: #fff; border-radius: 50%; border: 3px solid #7c3aed;
        }

        /* Кнопки Далее/Пропустить */
        .bottom-actions {
            margin-top: auto;
            padding-top: 20px;
            display: flex;
            gap: 10px;
        }
        .btn-primary {
            flex: 1;
            background: #7c3aed;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-primary:active { background: #6d28d9; }
        .btn-secondary {
            background: #18181b;
            color: #a1a1aa;
            border: 1px solid #27272a;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* --- НАСТРОЙКИ (Шестеренка) --- */
        .settings-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #09090b;
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        .settings-modal.active { transform: translateY(0); }
        .settings-header { display: flex; align-items: center; margin-bottom: 20px; font-size: 18px; font-weight: bold; }
        .settings-group { margin-bottom: 20px; }
        .settings-title { font-size: 11px; color: #71717a; text-transform: uppercase; margin-bottom: 10px; font-weight: 600; }
        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            background: #18181b; padding: 15px; border-radius: 12px; margin-bottom: 10px;
        }
        .toggle-switch {
            position: relative; width: 44px; height: 24px; background: #27272a; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        .toggle-switch::after {
            content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: white; border-radius: 50%; transition: 0.3s;
        }
        .toggle-switch.on { background: #7c3aed; }
        .toggle-switch.on::after { transform: translateX(20px); }
    </style>
</head>
<body>

    <!-- СТАРТОВЫЙ ЭКРАН -->
    <div class="screen start-screen" id="startScreen">
        <div class="logo-main">LFG</div>
        <div class="logo-sub">Looking for group</div>
        <button class="start-btn" onclick="startRegistration()">Создать анкету</button>
        <button class="settings-btn" onclick="toggleSettings()">
            <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
        </button>
    </div>

    <!-- ЭКРАН АНКЕТЫ (ШАГ 1) -->
    <div class="screen hidden" id="regScreen">
        <div class="header">
            <button class="back-btn" onclick="backToStart()">←</button>
            <span class="progress-text" id="progressText">1/9</span>
        </div>
        
        <div class="form-container" id="formContainer">
            <!-- Здесь будут меняться шаги через JS -->
        </div>

        <div class="bottom-actions" id="bottomActions">
            <!-- Кнопки будут добавляться через JS -->
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
    <div class="settings-modal" id="settingsModal">
        <div class="settings-header">
            <button class="back-btn" onclick="toggleSettings()" style="margin-right: 10px;">←</button>
            Настройки поиска
        </div>

        <div class="settings-group">
            <div class="toggle-row">
                <span>Подобрать автоматически</span>
                <div class="toggle-switch" onclick="this.classList.toggle('on')"></div>
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-title">Что ищу</div>
            <div class="toggle-row" style="justify-content: center; color: #7c3aed; font-weight: bold; cursor: pointer;">
                Тиммейтов
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-title">Пол тиммейтов</div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-secondary" style="flex: 1; padding: 10px; font-size: 14px;">Парней</button>
                <button class="btn-secondary" style="flex: 1; padding: 10px; font-size: 14px;">Девушек</button>
                <button class="btn-primary" style="flex: 1; padding: 10px; font-size: 14px;">Не важно</button>
            </div>
        </div>

        <div class="settings-group">
            <div class="settings-title">Возраст (18-35)</div>
            <input type="range" class="range-slider" min="18" max="35" value="25">
        </div>

        <button class="btn-primary" style="margin-top: auto;" onclick="toggleSettings()">Сохранить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- ЛОГИКА НАСТРОЕК ---
        function toggleSettings() {
            document.getElementById('settingsModal').classList.toggle('active');
        }

        // --- ЛОГИКА РЕГИСТРАЦИИ ---
        let currentStep = 1;
        const totalSteps = 9;
        const formContainer = document.getElementById('formContainer');
        const progressText = document.getElementById('progressText');
        const bottomActions = document.getElementById('bottomActions');

        function startRegistration() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('regScreen').classList.remove('hidden');
            renderStep();
        }

        function backToStart() {
            document.getElementById('regScreen').classList.add('hidden');
            document.getElementById('startScreen').classList.remove('hidden');
            currentStep = 1;
        }

        function nextStep() {
            if (currentStep < totalSteps) {
                currentStep++;
                renderStep();
            } else {
                // Завершение
                alert("Анкета создана! (Имитация)");
                backToStart();
            }
        }

        function prevStep() {
            if (currentStep > 1) {
                currentStep--;
                renderStep();
            }
        }

        // --- РЕНДЕР ШАГОВ ---
        function renderStep() {
            progressText.innerText = `${currentStep}/${totalSteps}`;
            formContainer.innerHTML = '';
            bottomActions.innerHTML = '';

            if (currentStep === 1) {
                formContainer.innerHTML = `
                    <div class="step-title">Тебе есть 18?</div>
                    <div class="step-desc">Анкеты доступны только совершеннолетним.</div>
                    <div class="checkbox-card" onclick="this.classList.toggle('active')">
                        <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="checkbox-text">Мне исполнилось 18 лет. Обязуюсь общаться уважительно.</div>
                    </div>
                    <div class="checkbox-card" onclick="this.classList.toggle('active')">
                        <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="checkbox-text">Я согласен с политикой обработки персональных данных.</div>
                    </div>
                `;
                bottomActions.innerHTML = `<button class="btn-primary" onclick="nextStep()">Далее</button>`;
            } 
            else if (currentStep === 2) {
                formContainer.innerHTML = `
                    <div class="step-title">Создание анкеты</div>
                    <div class="step-desc">Основное о тебе.</div>
                    <div class="input-group">
                        <label class="input-label">Имя</label>
                        <input type="text" class="text-input" placeholder="Как тебя зовут?" value="Игрок">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Дата рождения</label>
                        <input type="date" class="text-input">
                    </div>
                `;
                bottomActions.innerHTML = `
                    <button class="btn-secondary" onclick="prevStep()">Назад</button>
                    <button class="btn-primary" onclick="nextStep()">Далее</button>
                `;
            }
            else if (currentStep === 3) {
                formContainer.innerHTML = `
                    <div class="step-title">Кого ищем?</div>
                    <div class="step-desc">Можно выбрать оба варианта.</div>
                    <div class="checkbox-card" onclick="this.classList.toggle('active')">
                        <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="checkbox-text">Поиск няшки (отношения)</div>
                    </div>
                    <div class="checkbox-card active" onclick="this.classList.toggle('active')">
                        <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="checkbox-text">Поиск тиммейтов (пати, стак)</div>
                    </div>
                `;
                bottomActions.innerHTML = `
                    <button class="btn-secondary" onclick="prevStep()">Назад</button>
                    <button class="btn-primary" onclick="nextStep()">Далее</button>
                `;
            }
            else if (currentStep === 4) {
                formContainer.innerHTML = `
                    <div class="step-title">Во что играешь?</div>
                    <div class="step-desc">Выбери игры, чтобы найти общие интересы.</div>
                    <div class="games-grid">
                        <div class="game-card" onclick="toggleGame(this, 'cs2')">
                            <div class="game-icon"><svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg></div>
                            <div class="game-name">CS2</div>
                        </div>
                        <div class="game-card" onclick="toggleGame(this, 'dota')">
                            <div class="game-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg></div>
                            <div class="game-name">Dota 2</div>
                        </div>
                        <div class="game-card" onclick="toggleGame(this, 'val')">
                            <div class="game-icon"><svg viewBox="0 0 24 24"><path d="M12 2L2 22h20L12 2zm0 4.5l6.5 13h-13L12 6.5z"/></svg></div>
                            <div class="game-name">Valorant</div>
                        </div>
                        <div class="game-card" onclick="toggleGame(this, 'pubg')">
                            <div class="game-icon"><svg viewBox="0 0 24 24"><path d="M21 6h-2v9H6v2c0 .55.45 1 1 1h11l4 4V7c0-.55-.45-1-1-1zm-4 6V3c0-.55-.45-1-1-1H3c-.55 0-1 .45-1 1v14l4-4h10c.55 0 1-.45 1-1z"/></svg></div>
                            <div class="game-name">PUBG</div>
                        </div>
                    </div>

                    <!-- Ползунок для CS2 (скрыт по умолчанию) -->
                    <div class="rank-slider-container" id="cs2Rank">
                        <div class="rank-title">Твой ранг в CS2 (Faceit):</div>
                        <div class="rank-value" id="cs2Value
