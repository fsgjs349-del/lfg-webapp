<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LFG | Looking For Group</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* --- СБРОС И БАЗА --- */
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f0f13;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            perspective: 1000px; /* Для 3D эффектов */
        }

        /* --- ШАПКА --- */
        header {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        .logo-container {
            text-align: center;
        }
        .logo-main {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ff6b00, #ff00cc, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .logo-sub {
            font-size: 10px;
            letter-spacing: 4px;
            color: #888;
            text-transform: uppercase;
            margin-top: 5px;
        }

        /* Кнопка настроек в углу */
        .settings-btn {
            position: absolute;
            right: 20px;
            top: 25px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            font-size: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s, background 0.3s;
        }
        .settings-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.2); }

        /* --- ОСНОВНОЙ ЭКРАН (КАРТОЧКИ) --- */
        .main-screen {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.4s;
        }
        .main-screen.hide {
            transform: translateX(-100%) scale(0.9);
            opacity: 0;
            pointer-events: none;
        }

        /* 3D Карточка */
        .profile-card {
            width: 85%;
            max-width: 350px;
            height: 55vh;
            background: linear-gradient(145deg, #1a1a24, #242432);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: absolute;
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            transform-style: preserve-3d;
            user-select: none;
        }
        .profile-card .placeholder-text {
            text-align: center;
            color: #666;
            font-size: 16px;
        }

        /* --- НИЖНИЕ КНОПКИ --- */
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px 20px;
            padding-bottom: env(safe-area-inset-bottom, 40px);
            z-index: 10;
        }
        .btn-round {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3), inset 0 -3px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-round:active { transform: translateY(4px); box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .btn-skip { background: linear-gradient(145deg, #ff477e, #d61a50); color: white; }
        .btn-like { background: linear-gradient(145deg, #00e5a0, #00b37d); color: white; }

        /* --- НАСТРОЙКИ (ВЫЕЗЖАЮЩАЯ ПАНЕЛЬ) --- */
        .settings-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f0f13;
            z-index: 20;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            padding: 20px;
            padding-top: env(safe-area-inset-top, 40px);
            overflow-y: auto;
        }
        .settings-screen.active {
            transform: translateY(0);
        }
        
        .settings-header {
            display: flex;
            align-items: center;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: bold;
        }
        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            margin-right: 15px;
            cursor: pointer;
        }

        /* Стили настроек (как на скринах) */
        .settings-group { margin-bottom: 30px; }
        .settings-group-title {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        /* Переключатели (Toggles) */
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1a1a24;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .toggle-switch {
            position: relative;
            width: 50px;
            height: 28px;
            background: #333;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s;
        }
        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            transition: 0.3s;
        }
        .toggle-switch.on { background: #9c27b0; }
        .toggle-switch.on::after { transform: translateX(22px); }

        /* Кнопки-теги (платформы, пол) */
        .tags-container { display: flex; gap: 10px; flex-wrap: wrap; }
        .tag-btn {
            padding: 12px 20px;
            border-radius: 12px;
            background: #1a1a24;
            border: 1px solid #333;
            color: #aaa;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            flex: 1;
            text-align: center;
        }
        .tag-btn.active {
            border-color: #00e5a0;
            color: #00e5a0;
            background: rgba(0, 229, 160, 0.1);
        }

        /* Ползунок возраста */
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #333;
            border-radius: 3px;
            outline: none;
            margin-top: 10px;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            background: white;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Кнопка Сохранить */
        .save-btn {
            margin-top: auto;
            background: linear-gradient(90deg, #a855f7, #ec4899);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(168, 85, 247, 0.3);
            transition: transform 0.2s;
        }
        .save-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo-container">
            <div class="logo-main">LFG</div>
            <div class="logo-sub">Looking for group</div>
        </div>
        <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
    </header>

    <!-- Основной экран -->
    <div class="main-screen" id="mainScreen">
        <div class="profile-card" id="card3D">
            <div class="placeholder-text">
                <h2 style="margin-bottom:10px">Анкета</h2>
                <p>Здесь будут появляться<br>тиммейты</p>
            </div>
        </div>
    </div>

    <!-- Нижние кнопки (дизлайк/лайк) -->
    <div class="action-buttons" id="actionButtons">
        <button class="btn-round btn-skip">✖</button>
        <button class="btn-round btn-like">✔</button>
    </div>

    <!-- Экран настроек -->
    <div class="settings-screen" id="settingsScreen">
        <div class="settings-header">
            <button class="back-btn" onclick="toggleSettings()">←</button>
            Настройки поиска
        </div>

        <!-- Автоподбор -->
        <div class="settings-group">
            <div class="toggle-row">
                <span>✨ Подобрать автоматически</span>
                <div class="toggle-switch" onclick="this.classList.toggle('on')"></div>
            </div>
        </div>

        <!-- Что ищу -->
        <div class="settings-group">
            <div class="settings-group-title">Что ищу</div>
            <div class="tags-container">
                <button class="tag-btn">💖 Няшек</button>
                <button class="tag-btn active">🎮 Тиммейтов</button>
            </div>
        </div>

        <!-- Пол -->
        <div class="settings-group">
            <div class="settings-group-title">Пол тиммейтов</div>
            <div class="tags-container">
                <button class="tag-btn active">💙💖 Не важно</button>
            </div>
        </div>

        <!-- Возраст -->
        <div class="settings-group">
            <div class="settings-group-title">Возраст (18-75)</div>
            <input type="range" class="range-slider" min="18" max="75" value="25">
        </div>

        <!-- Платформы -->
        <div class="settings-group">
            <div class="settings-group-title">Платформы</div>
            <div class="tags-container">
                <button class="tag-btn">🖥 ПК</button>
                <button class="tag-btn active">🎮 Консоли</button>
                <button class="tag-btn">📱 Телефон</button>
            </div>
        </div>

        <!-- Кнопка Сохранить -->
        <button class="save-btn" onclick="toggleSettings()">Сохранить</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // --- Логика открытия/закрытия настроек ---
        function toggleSettings() {
            const settingsScreen = document.getElementById('settingsScreen');
            const mainScreen = document.getElementById('mainScreen');
            const actionButtons = document.getElementById('actionButtons');
            
            settingsScreen.classList.toggle('active');
            
            if (settingsScreen.classList.contains('active')) {
                mainScreen.classList.add('hide');
                actionButtons.style.opacity = '0';
            } else {
                mainScreen.classList.remove('hide');
                actionButtons.style.opacity = '1';
            }
        }

        // --- 3D Эффект наклона карточки ---
        const card = document.getElementById('card3D');
        
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) return; // Отключаем на телефоне при скролле, чтобы не мешало
            const xAxis = (window.innerWidth / 2 - e.pageX) / 20;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 20;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Сброс при отпускании (для тач-экранов)
        document.addEventListener('touchend', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // Добавляем эффект нажатия на кнопки-теги
        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                // Убираем active у всех в этой группе
                let parent = this.parentElement;
                parent.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
                // Добавляем текущей
                this.classList.add('active');
            });
        });

        // Эффект нажатия на круглые кнопки
        document.querySelectorAll('.btn-round').forEach(btn => {
            btn.addEventListener('click', function() {
                tg.HapticFeedback.impactOccurred('medium');
                this.style.transform = 'scale(0.8)';
                setTimeout(() => this.style.transform = 'scale(1)', 150);
            });
        });
    </script>
</body>
</html>
