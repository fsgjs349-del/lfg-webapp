<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LFG | Looking For Group</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #050505;
            color: #e4e4e7;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(124, 58, 237, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 170, 0.08), transparent 25%);
        }

        /* Экраны */
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 1;
        }
        .screen.hidden { opacity: 0; transform: translateX(15%); pointer-events: none; z-index: 0; }

        /* Стартовый экран */
        .start-screen { justify-content: center; align-items: center; text-align: center; padding: 20px; }
        .logo-main { font-size: 68px; font-weight: 900; letter-spacing: 4px; color: #fff; text-shadow: 0 0 50px rgba(139, 92, 246, 0.7); margin-bottom: 5px; }
        .logo-sub { font-size: 13px; letter-spacing: 7px; color: #71717a; text-transform: uppercase; margin-bottom: 30px; }
        .start-desc { color: #a1a1aa; font-size: 15px; line-height: 1.6; margin-bottom: 40px; max-width: 300px; }
        
        .start-btn {
            background: linear-gradient(180deg, #8b5cf6, #6d28d9); color: white; border: none; border-radius: 16px;
            font-size: 18px; font-weight: 700; padding: 20px; width: 100%; max-width: 320px; cursor: pointer;
            box-shadow: 0 8px 0 #4c1d95; transition: transform 0.1s, box-shadow 0.1s; user-select: none;
        }
        .start-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #4c1d95; }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; flex-shrink: 0; }
        .back-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
            width: 40px; height: 40px; display: flex; justify-content: center; align-items: center;
            color: #a1a1aa; font-size: 20px; cursor: pointer;
        }
        .back-btn:active { background: rgba(255,255,255,0.15); }
        .progress-container { flex: 1; margin: 0 15px; height: 6px; background: #27272a; border-radius: 3px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #ff007f, #8b5cf6); width: 20%; transition: width 0.4s; border-radius: 3px; }
        .progress-text { font-size: 13px; color: #71717a; font-weight: 800; }

        /* Контент */
        .form-container { flex: 1; padding: 10px 20px; overflow-y: auto; display: flex; flex-direction: column; }
        .step-title { font-size: 26px; font-weight: 800; margin-bottom: 10px; color: #fff; }
        .step-desc { font-size: 14px; color: #a1a1aa; margin-bottom: 25px; }

        /* Поля ввода */
        .input-group { margin-bottom: 20px; }
        .input-label { font-size: 11px; color: #71717a; text-transform: uppercase; margin-bottom: 8px; display: block; font-weight: 800; }
        .text-input { width: 100%; background: #18181b; border: 1px solid #3f3f46; color: #fff; padding: 15px; border-radius: 12px; font-size: 15px; outline: none; }
        .text-input:focus { border-color: #8b5cf6; }

        /* Чекбокс */
        .checkbox-card { display: flex; align-items: center; gap: 15px; background: #18181b; border: 1px solid #3f3f46; padding: 20px; border-radius: 16px; cursor: pointer; }
        .checkbox-card.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.1); }
        .checkbox-box { width: 26px; height: 26px; border-radius: 6px; border: 2px solid #52525b; display: flex; justify-content: center; align-items: center; }
        .checkbox-card.active .checkbox-box { background: #8b5cf6; border-color: #8b5cf6; }
        .checkbox-box svg { width: 16px; height: 16px; fill: white; display: none; }
        .checkbox-card.active .checkbox-box svg { display: block; }
        .checkbox-text { font-size: 15px; color: #e4e4e7; font-weight: 600; }

        /* Сетка игр */
        .games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .game-card { background: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
        .game-card.active { border-color: #8b5cf6; background: rgba(139, 92, 246, 0.15); }
        .game-name { font-size: 13px; font-weight: 700; color: #e4e4e7; }

        /* Кнопки */
        .bottom-actions { margin-top: auto; padding-top: 20px; display: flex; gap: 12px; flex-shrink: 0; }
        .btn { border: none; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: transform 0.1s; }
        .btn:active { transform: translateY(3px); }
        .btn-primary { background: #8b5cf6; color: white; padding: 18px; }
        .btn-secondary { background: #18181b; color: #e4e4e7; border: 1px solid #3f3f46; padding: 18px; }
        .btn-half { flex: 1; }
    </style>
</head>
<body>

    <div class="screen start-screen" id="startScreen">
        <div class="logo-main">LFG</div>
        <div class="logo-sub">Looking for group</div>
        <div class="start-desc">Найди своих напарников для игр. Укажи ранг, выбери платформу и общайся с теми, кто разделяет твои интересы.</div>
        <button class="start-btn" onclick="goToForm()">Создать анкету</button>
    </div>

    <div class="screen hidden" id="regScreen">
        <div class="header">
            <button class="back-btn" onclick="prevStep()">←</button>
            <div class="progress-container"><div class="progress-bar" id="progressBar"></div></div>
            <span class="progress-text" id="progressText">1/3</span>
        </div>
        <div class="form-container" id="formContainer"></div>
        <div class="bottom-actions" id="bottomActions"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        if (tg) tg.expand();

        let step = 1;

        function goToForm() {
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('regScreen').classList.remove('hidden');
            step = 1;
            updateUI();
        }

        function nextStep() {
            if (step < 3) {
                step++;
                updateUI();
            } else {
                alert("Анкета успешно создана!");
                location.reload();
            }
        }

        function prevStep() {
            if (step > 1) {
                step--;
                updateUI();
            } else {
                document.getElementById('regScreen').classList.add('hidden');
                document.getElementById('startScreen').classList.remove('hidden');
            }
        }

        function updateUI() {
            const container = document.getElementById('formContainer');
            const actions = document.getElementById('bottomActions');
            document.getElementById('progressBar').style.width = (step / 3 * 100) + '%';
            document.getElementById('progressText').innerText = step + '/3';
            
            container.innerHTML = '';
            actions.innerHTML = '';

            if (step === 1) {
                container.innerHTML = `
                    <div class="step-title">Правила проекта</div>
                    <div class="step-desc">Ознакомься с правилами перед созданием анкеты.</div>
                    <div class="checkbox-card" onclick="this.classList.toggle('active')">
                        <div class="checkbox-box"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
                        <div class="checkbox-text">Я согласен с правилами</div>
                    </div>
                `;
                actions.innerHTML = `<button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>`;
            } else if (step === 2) {
                container.innerHTML = `
                    <div class="step-title">Твои данные</div>
                    <div class="step-desc">Как тебя будут видеть другие.</div>
                    <div class="input-group"><label class="input-label">Никнейм</label><input type="text" class="text-input" placeholder="Введи ник"></div>
                `;
                actions.innerHTML = `
                    <button class="btn btn-secondary btn-half" onclick="prevStep()">Назад</button>
                    <button class="btn btn-primary btn-half" onclick="nextStep()">Далее</button>
                `;
            } else if (step === 3) {
                container.innerHTML = `
                    <div class="step-title">Во что играешь?</div>
                    <div class="step-desc">Выбери игру.</div>
                    <div class="games-grid">
                        <div class="game-card" onclick="this.classList.toggle('active')"><div class="game-name">CS2</div></div>
                        <div class="game-card" onclick="this.classList.toggle('active')"><div class="game-name">Dota 2</div></div>
                    </div>
                `;
                actions.innerHTML = `
                    <button class="btn btn-secondary btn-half" onclick="prevStep()">Назад</button>
                    <button class="btn btn-primary btn-half" onclick="nextStep()">Завершить</button>
                `;
            }
        }
    </script>
</body>
</html>
