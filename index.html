<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a12">
<title>LFG — Looking For Group</title>
<style>
:root{--bg:#0a0a12;--panel:#15121f;--panel2:#1d1930;--pink:#ea16c8;--pink-d:#8f0a7c;
--teal:#2dd4a8;--teal-d:#0e7a5f;--red:#ff4d6a;--red-d:#a1203a;--text:#eef;--muted:#8b87a3}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;color:var(--text);overflow:hidden;
  background:radial-gradient(900px 600px at 85% -10%,#2a0f3a 0%,transparent 55%),
             radial-gradient(800px 600px at -10% 110%,#0f2d33 0%,transparent 55%),var(--bg);
  display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
button{font-family:inherit;border:none;cursor:pointer;color:var(--text)}
input,textarea,select{font-family:inherit}
.b3d{border-radius:16px;background:linear-gradient(180deg,var(--panel2),#14101f);
  box-shadow:0 5px 0 #0b0814,0 10px 20px #000a,inset 0 1px 0 #ffffff22;transition:transform .1s,box-shadow .1s}
.b3d:active{transform:translateY(4px);box-shadow:0 1px 0 #0b0814,0 4px 8px #000a,inset 0 1px 0 #ffffff22}

/* ─── ОНБОРДИНГ ─── */
#ob{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
#ob[hidden]{display:none}
.ob-top{display:flex;align-items:center;gap:14px;padding:16px 16px 8px}
#obBack{width:44px;height:44px;font-size:20px;border-radius:14px;flex:none}
.ob-bar{flex:1;height:8px;border-radius:8px;background:#ffffff14;overflow:hidden;box-shadow:inset 0 2px 4px #0009}
#obFill{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--pink),var(--teal));
  transition:width .35s cubic-bezier(.2,.8,.3,1)}
.ob-viewport{flex:1;overflow:hidden}
.ob-slides{display:flex;height:100%;transition:transform .42s cubic-bezier(.2,.8,.3,1)}
.ob-slide{min-width:100%;height:100%;overflow-y:auto;display:flex;flex-direction:column;
  justify-content:center;align-items:center;text-align:center;padding:20px 24px;gap:16px}
.ob-logo b{font-size:56px;letter-spacing:4px;font-weight:900;color:var(--pink);
  text-shadow:0 0 24px #ea16c866,0 6px 0 #6d065d}
.ob-logo small{display:block;letter-spacing:6px;color:var(--muted);font-size:11px;margin-top:6px}
.ob-slide h2{font-size:26px;line-height:1.2}
.ob-slide p{color:var(--muted);font-size:15px}
.inp{width:100%;max-width:320px;background:#120f1e;border:1px solid #ffffff20;border-radius:14px;
  color:#fff;font-size:18px;padding:14px 16px;outline:none;text-align:center;
  box-shadow:inset 0 3px 8px #000a;transition:border-color .2s}
.inp:focus{border-color:var(--teal)}
.grow{display:flex;gap:12px;width:100%;max-width:340px}
.gbtn{flex:1;padding:18px 6px;font-size:16px;font-weight:800;border-radius:18px}
.gbtn .e{display:block;font-size:34px;margin-bottom:6px}
.gbtn.on{background:linear-gradient(180deg,#3ae2ff,#1587d8);color:#04202e;
  box-shadow:0 5px 0 #0c4d78,0 12px 24px #1587d855,inset 0 1px 0 #ffffff66}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:360px}
.chip{padding:10px 14px;border-radius:14px;font-weight:700;font-size:14px}
.chip.on{background:linear-gradient(180deg,#3fe8bd,#14a181);color:#04231c;
  box-shadow:0 4px 0 var(--teal-d),0 10px 18px #2dd4a844,inset 0 1px 0 #ffffff66}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.av{font-size:34px;padding:12px;border-radius:18px;aspect-ratio:1;display:grid;place-items:center}
.av.on{background:linear-gradient(180deg,#ff5fd0,#b01288);box-shadow:0 4px 0 var(--pink-d),0 10px 20px #ea16c855,inset 0 1px 0 #ffffff66}
.ob-cta{width:100%;max-width:320px;padding:16px;font-size:17px;font-weight:900;border-radius:18px;
  background:linear-gradient(180deg,#f43ad4,#a80b8a);color:#fff;letter-spacing:.5px;
  box-shadow:0 6px 0 var(--pink-d),0 14px 30px #ea16c844,inset 0 2px 2px #ffffff55;transition:transform .1s,box-shadow .1s}
.ob-cta:active{transform:translateY(5px);box-shadow:0 1px 0 var(--pink-d),0 5px 10px #ea16c844,inset 0 2px 2px #ffffff55}
.ob-cta:disabled{filter:grayscale(.8) brightness(.6);pointer-events:none}

/* ─── ПРИЛОЖЕНИЕ ─── */
#app{flex:1;display:flex;flex-direction:column;min-height:0}
#app[hidden]{display:none}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 6px}
.logo{flex:1;text-align:center;line-height:1}
.logo b{font-size:30px;letter-spacing:4px;font-weight:900;color:var(--pink);text-shadow:0 0 18px #ea16c855,0 4px 0 #6d065d}
.logo small{display:block;font-size:9px;letter-spacing:5px;color:var(--muted);margin-top:4px}
#gearBtn{width:46px;height:46px;border-radius:50%;font-size:20px;flex:none}
#screens{flex:1;position:relative;min-height:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:4px 14px 0;min-height:0}
.screen[hidden]{display:none}
.screen.in>*{animation:up .35s cubic-bezier(.2,.8,.3,1)}
@keyframes up{from{opacity:0;transform:translateY(16px)}}

#stage{position:relative;width:100%;max-width:400px;flex:1;min-height:320px;max-height:560px;perspective:1100px}
.card{position:absolute;inset:0;border-radius:26px;overflow:hidden;background:var(--panel);
  border:1px solid #ffffff14;box-shadow:0 14px 44px #000c;touch-action:none;will-change:transform;cursor:grab;
  transition:transform .35s cubic-bezier(.2,.8,.3,1),opacity .35s}
.card:active{cursor:grabbing}
.ava{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:110px;
  box-shadow:inset 0 -90px 70px -40px #000000b3}
.cinfo{position:absolute;left:0;right:0;bottom:0;padding:14px 16px 16px;z-index:3}
.cname{font-size:28px;font-weight:800}
.cname span{color:var(--teal)}
.cmeta{display:flex;align-items:center;gap:10px;font-size:15px;margin-top:2px}
.cmeta b{color:#ffffff55;font-weight:400}
.cgames{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.cg{background:#0f2c28cc;border:1px solid var(--teal);padding:5px 11px;border-radius:12px;font-weight:700;font-size:13px}
.cbio{margin-top:10px;font-size:14px;color:#cfcbe2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.stamp{position:absolute;top:34px;padding:8px 18px;font-size:28px;font-weight:900;letter-spacing:2px;
  border:4px solid;border-radius:12px;opacity:0;z-index:4;pointer-events:none}
.s-like{left:20px;color:var(--teal);border-color:var(--teal);transform:rotate(-18deg)}
.s-nope{right:20px;color:var(--red);border-color:var(--red);transform:rotate(18deg)}
.empty{position:absolute;inset:0;border-radius:26px;border:1px dashed #ffffff2a;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:20px}
.empty button{padding:12px 20px;border-radius:14px;font-weight:800;background:linear-gradient(180deg,#3fe8bd,#14a181);color:#04231c}

.actions{display:flex;align-items:center;justify-content:center;gap:14px;padding:14px 0 10px}
.abtn{border-radius:50%;display:grid;place-items:center;position:relative;color:#fff;transition:transform .1s,box-shadow .1s}
.abtn:active{transform:translateY(5px) scale(.95)}
.abtn .dot{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;border-radius:10px;background:var(--teal);
  color:#04211c;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 2px 4px #000a;padding:0 4px}
#btnRewind{width:52px;height:52px;font-size:20px;background:linear-gradient(180deg,#2b2740,#191531);box-shadow:0 5px 0 #0b0814,0 10px 20px #000a,inset 0 1px 0 #ffffff22}
#btnNope{width:72px;height:72px;font-size:30px;background:linear-gradient(180deg,#ff6b85,#e6355a);box-shadow:0 6px 0 var(--red-d),0 14px 28px #ff4d6a44,inset 0 2px 3px #ffffff55}
#btnStar{width:52px;height:52px;font-size:20px;color:#2dd4a8;background:linear-gradient(180deg,#2b2740,#191531);box-shadow:0 5px 0 #0b0814,0 10px 20px #000a,inset 0 1px 0 #ffffff22}
#btnLike{width:72px;height:72px;font-size:30px;background:linear-gradient(180deg,#3fe8bd,#14a181);box-shadow:0 6px 0 var(--teal-d),0 14px 28px #2dd4a855,inset 0 2px 3px #ffffff77}
#btnMsg{width:52px;height:52px;font-size:20px;background:linear-gradient(180deg,#2b2740,#191531);box-shadow:0 5px 0 #0b0814,0 10px 20px #000a,inset 0 1px 0 #ffffff22}

/* списки */
.list{width:100%;max-width:400px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:8px 0 12px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:linear-gradient(180deg,var(--panel2),#14101f);
  box-shadow:0 4px 0 #0b0814,0 10px 18px #0008,inset 0 1px 0 #ffffff1c}
.row .rav{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;flex:none}
.row .rt{flex:1;min-width:0}.row .rt b{font-size:16px}.row .rt small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row button{padding:10px 14px;border-radius:12px;font-weight:800;font-size:13px}
.rbtn-ok{background:linear-gradient(180deg,#3fe8bd,#14a181);color:#04231c;box-shadow:0 3px 0 var(--teal-d)}
.rbtn-no{background:linear-gradient(180deg,#2b2740,#191531);color:#c9c5e0;box-shadow:0 3px 0 #0b0814}
.starm{margin-left:4px}

/* профиль */
.pcard{width:100%;max-width:400px;margin-top:8px;border-radius:26px;overflow:hidden;background:var(--panel);
  border:1px solid #ffffff14;box-shadow:0 14px 40px #000c}
.pava{height:190px;display:flex;align-items:center;justify-content:center;font-size:90px}
.pbody{padding:16px}
.pbody .pname{font-size:26px;font-weight:800}.pname span{color:var(--teal)}
.prowbtn{display:flex;gap:10px;margin-top:14px}
.prowbtn button{flex:1;padding:13px;border-radius:14px;font-weight:800}
.p-edit{background:linear-gradient(180deg,#f43ad4,#a80b8a);color:#fff;box-shadow:0 4px 0 var(--pink-d)}
.p-reset{
